# Nombre del microservicio y puerto (evita choque con otros ms)
spring.application.name=inventario_ms
server.port=8083

# Conexion a MySQL (cambia user/pass y si la BD tiene otro nombre)
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_ms?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=tu_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect