spring.application.name=inventario_ms

# Puerto del microservicio Inventario
server.port=8084

# Base de datos del microservicio Inventario
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_ms?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Basic Auth
spring.security.user.name=admin
spring.security.user.password=admin123

# Logs propios
logging.file.name=logs/inventario_ms.log
logging.level.root=INFO
logging.level.com.example.inventario_ms=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
